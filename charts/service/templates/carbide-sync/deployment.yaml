{{- $caBundleConfigMap := required "certs.caBundle.configMap is required" .Values.certs.caBundle.configMap }}

apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: fulfillment-carbide-sync
spec:
  selector:
    matchLabels:
      app: fulfillment-carbide-sync
  replicas: 1
  template:
    metadata:
      labels:
        app: fulfillment-carbide-sync
    spec:
      volumes:
      - name: cert
        secret:
          secretName: fulfillment-database-client-cert
      - name: tls
        secret:
          secretName: fulfillment-carbide-sync-tls
      serviceAccountName: carbide-sync
      containers:
      - name: carbide-sync
        image: {{ .Values.images.service }}
        imagePullPolicy: Always
        volumeMounts:
        - name: cert
          mountPath: /secrets/cert
        - name: tls
          mountPath: /etc/fulfillment-carbide-sync/tls
        env:
        - name: TENANT_SECRET_NAME
          value: {{ .Values.carbide.tenantSecretName }}
        - name: TENANT_SECRET_NAMESPACE
          value: {{ .Values.carbide.tenantSecretNamespace }}
        - name: CARBIDE_FLOW
          value: {{ .Values.carbide.flow }}
        command:
        - /usr/local/bin/fulfillment-service
        - start
        - carbide-sync
        - --log-level={{ .Values.log.level }}
        - --log-headers={{ .Values.log.headers }}
        - --log-bodies={{ .Values.log.bodies }}
        - --issuer={{ .Values.carbide.issuer }}
        - --endpoint={{ .Values.carbide.endpoint }}
